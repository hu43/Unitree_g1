  Zhanmusi:
    fps: 60
    motion_file: config/policy/mimic/zhanmusi_fix/params/zhanmusi_fix_60hz.csv
    policy_dir: config/policy/mimic/zhanmusi_fix/
    policy_file: config/policy/mimic/zhanmusi_fix/exported/zhanmusi_fix_clean.mnn
    time_start: 0
    time_end: 9.8    # CSV 588 行 / 60fps（g1_mimic_demo config 里的 12.4 是拷贝残留，勿抄）
  # Touqiu: 已解除按键绑定（2026-09-08 用户要求），状态与轨迹保留备用，无 transitions 指向
  Touqiu:
    # App 示教动作"投篮"录制回放（无策略，500Hz PD 跟踪 rt/lowstate 录制轨迹）
    # 轨迹 CSV 随项目部署，迁移到其他 29dof G1 无需重新示教
    traj_file: config/policy/replay/touqiu/touqiu_traj.csv
    time_start: 4.2      # 裁掉录制基线段（触发延迟）
    time_end: 18.5       # 裁掉尾部静止段（回放时长约 14.3s）
    speed: 0.5           # 回放速度倍率；首次验证建议改 0.5，确认跟踪良好后恢复 1.0
    entry_interp: 1.5    # 入口从当前姿态线性过渡到轨迹起点
    kp: [40.2, 99.1, 40.2, 99.1, 28.5, 28.5, 40.2, 99.1, 40.2, 99.1, 28.5, 28.5, 40.2, 28.5, 28.5, 14.3, 14.3, 14.3, 14.3, 14.3, 16.8, 16.8, 14.3, 14.3, 14.3, 14.3, 14.3, 16.8, 16.8]
    kd: [2.56, 6.31, 2.56, 6.31, 1.81, 1.81, 2.56, 6.31, 2.56, 6.31, 1.81, 1.81, 2.56, 1.81, 1.81, 0.907, 0.907, 0.907, 0.907, 0.907, 1.07, 1.07, 0.907, 0.907, 0.907, 0.907, 0.907, 1.07, 1.07]
