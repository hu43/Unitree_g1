  Jixiewu2:
    fps: 60
    motion_file: config/policy/mimic/jixiewu2_fix/params/jixiewu2_fix_60hz.csv
    policy_dir: config/policy/mimic/jixiewu2_fix/
    policy_file: config/policy/mimic/jixiewu2_fix/exported/jixiewu2_fix_clean.mnn
    time_start: 0
