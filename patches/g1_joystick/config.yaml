    motion_file: config/policy/mimic/su/params/su_60hz.csv
    policy_dir: config/policy/mimic/su/
    policy_file: config/policy/mimic/su/exported/su_clean.mnn
    time_start: 0
    time_end: 5.07
    # BGM(SIUUU音效) 与动作同时起停，无 music_lead；cache/Su_0.0s.wav 已补齐到 5.07s

  Video28:
    fps: 60
    motion_file: config/policy/mimic/video28/params/video28_60hz.csv
    policy_dir: config/policy/mimic/video28/
