    policy_dir: config/policy/mimic/bow/
    policy_file: config/policy/mimic/bow/exported/policy_bow.mnn
    time_start: 0
    time_end: 6.8

  Gangnam:
    fps: 60
    motion_file: config/policy/mimic/unistore/params/G1_gangnam_style_V01.bvh_60hz.csv
    policy_dir: config/policy/mimic/unistore/
    policy_file: config/policy/mimic/unistore/exported/gangnam_style.mnn
    time_start: 5.1
    time_end: 25.5
    music_lead: 4.0   # BGM 先播 4 秒再开始动作

  Video22:
    fps: 60
