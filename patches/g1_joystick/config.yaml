    # BGM 换成 kungfu_video22_fix.mp3（不再是广播体操曲）：
    # 配置在 music/music_helper.py 的 MUSIC["Video25"]，动作结束随 stop 事件停

  Video27:
    fps: 60
    motion_file: config/policy/mimic/video27_fix/params/video27_fix_60hz.csv
    policy_dir: config/policy/mimic/video27_fix/
    policy_file: config/policy/mimic/video27_fix/exported/video27_fix_clean.mnn
    time_start: 0
    time_end: 28.2
    music_lead: 3.0   # 已裁掉 1.0s 静音；lead 同步缩短

  LeftPunch:
    fps: 60
    motion_file: config/policy/mimic/LeftPunch/params/LeftPunch_60hz.csv
    policy_dir: config/policy/mimic/LeftPunch/
    policy_file: config/policy/mimic/LeftPunch/exported/LeftPunch_clean.mnn
    time_start: 0
    time_end: 5.4

  RightPunch:
    fps: 60
    motion_file: config/policy/mimic/RightPunch_fix/params/RightPunch_fix_60hz.csv
    policy_dir: config/policy/mimic/RightPunch_fix/
    policy_file: config/policy/mimic/RightPunch_fix/exported/RightPunch_fix_clean.mnn
